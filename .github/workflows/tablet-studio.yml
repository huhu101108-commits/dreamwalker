name: Tablet studio contracts
on:
  push:
    branches: [feature/tablet-production-studio]
    paths: ['Studio/**', '!Studio/**/*.md', 'Assets/Dreamwalker/**', 'ProjectSettings/**', 'Packages/**', '.github/workflows/tablet-studio.yml']
  pull_request:
    paths: ['Studio/**', '!Studio/**/*.md', 'Assets/Dreamwalker/**', 'ProjectSettings/**', 'Packages/**', '.github/workflows/tablet-studio.yml']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Unity templates against source
        working-directory: Studio
        run: |
          node scripts/sync-unity.mjs ..
          git diff --exit-code -- templates/unity.json
      - name: Verify tablet editor and game contracts
        working-directory: Studio
        run: npm test
      - name: Execute native combat timing and save contracts
        run: dotnet run --project Studio/scripts/native-check/StudioContract.csproj
      - name: Check owner entry and two-browser WebRTC
        run: |
          npm install --prefix "$RUNNER_TEMP/dw-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/dw-browser/node_modules" node Studio/scripts/test-browser-link.mjs

  unity-scripts:
    name: Compile Unity scripts with the project's Unity assemblies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Unity reference assemblies
        uses: actions/cache@v4
        with:
          path: ~/.cache/dreamwalker-unity
          key: unity-managed-ugui-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
      - name: Compile editor, editor-only and Android player scripts
        working-directory: Studio
        run: node scripts/unity-compile-check.mjs --fetch ~/.cache/dreamwalker-unity

  studio-connection:
    name: Connect the build runner to Studio
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/tablet-production-studio'
    needs: contracts
    runs-on: ${{ vars.DREAMWALKER_ANDROID_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: dreamwalker-studio-android
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connect and check Unity and physical devices
        run: node Studio/scripts/connect-actions-runner.mjs
      - name: Read published tablet editor, file picker and dialogue composer
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { studio } from './Studio/scripts/android-runner.mjs';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const pages = [['/', 'index.html'], ['/device-files', 'device-files.html'],
            ['/file-import.js', 'file-import.js'], ['/device-files.js', 'device-files.js'], ['/file-wire.js', 'file-wire.js'],
            ['/shot-view.js', 'shot-view.js'], ['/shot-editor.js', 'shot-editor.js'], ['/desk.js', 'desk.js']];
          for (const [route, file] of pages) {
            const response = await fetch(new URL(route, studio), {redirect:'error', signal:AbortSignal.timeout(15000)});
            const body = Buffer.from(await response.arrayBuffer()), actual = hash(body);
            const markers = route === '/' ? ['id="editor"','id="project-import"','/desk.js','/shot-editor.js','/shot-view.js'] :
              route === '/device-files' ? ['id="disk"','id="pair-code"','type="file"','편집기로 보내기','/device-files.js'] :
              route === '/shot-editor.js' ? ['drawShotEditor','이 줄 화면 편집','선택 레이어 크기 조절'] :
              route === '/shot-view.js' ? ['makeShotView','shotCoversField'] : [];
            if (markers.length) {
              const missing = markers.filter(marker => !body.toString('utf8').includes(marker));
              if (missing.length) throw Error(route + ' is missing published UI: ' + missing.join(', '));
              console.log(route + ' matched ' + markers.length + ' tablet UI markers');
            }
            const expected = hash(await readFile('Studio/src/' + file));
            if (!response.ok) throw Error(route + ' returned HTTP ' + response.status);
            console.log(route + ' HTTP ' + response.status + ' · ' +
              (actual === expected ? 'matches checked-out source' : 'different published source') + ' · ' + actual);
          }
          JS
