name: Godot 4.7.2 combat checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  godot-headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: false
      - name: Verify Godot version
        run: godot --version
      - name: Import scenes and scripts
        run: godot --headless --path . --editor --import --quit
      - name: Verify deterministic combat
        run: godot --headless --path . --script res://tests/test_combat.gd
