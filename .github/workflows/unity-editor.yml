name: Unity editor tests and Android build
# Runs the Unity Test Framework tests (edit mode and play mode) and builds the development APK in the real Unity
# editor (GameCI containers). It needs a Unity license: the repository secrets UNITY_LICENSE (the contents of a
# Unity_lic.ulf file), UNITY_EMAIL and UNITY_PASSWORD. Without them the jobs are skipped and say so.
on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Also build the development APK'
        type: boolean
        default: true
  push:
    branches: [feature/tablet-production-studio]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/unity-editor.yml']
  pull_request:
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/unity-editor.yml']

permissions:
  contents: read

concurrency:
  group: unity-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Check for a Unity license
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD are not all set, so the Unity editor tests and the APK build were skipped."
          fi

  tests:
    name: Unity edit-mode and play-mode tests
    needs: license
    if: needs.license.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          testMode: all
          artifactsPath: unity-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: unity-test-results

  android:
    name: Development APK
    needs: [license, tests]
    if: needs.license.outputs.ready == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          versioning: None
          buildMethod: Dreamwalker.EditorTools.CreateCombatDemo.BuildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: dreamwalker-development-apk
          path: Build/Dreamwalker.apk
          if-no-files-found: error
