<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드림워커 제작 GPT</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;color:#edf5f5;background:#10232e}
*{box-sizing:border-box}body{margin:0}main{display:grid;gap:.75rem;margin:0 auto;padding:1rem;max-width:55rem}h1,h2,p{margin:0}h1{font-size:1.25rem}h2{font-size:1.02rem}
header,.actions{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
button,select,textarea,a{font:inherit}button,select,a{min-height:2.7rem;border-radius:.48rem;padding:.4rem .7rem}
button,select,textarea{background:#192f3c;color:#f1f7f8;border:1px solid #56737d}
button{cursor:pointer}button:disabled{opacity:.55;cursor:default}button.primary{background:#a1dfcf;color:#102831;border-color:#a1dfcf;font-weight:700}
label{display:grid;gap:.25rem}textarea{resize:vertical;min-height:4.3rem;border-radius:.45rem;padding:.65rem;width:100%}button:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #a1f4e7;outline-offset:2px}
form,section,details[open]{display:grid;gap:.55rem}[hidden]{display:none!important}summary{cursor:pointer;color:#c2d6da}small,output,.muted{color:#bfd1d6;font-size:.9rem}output{overflow-wrap:anywhere}a{display:inline-flex;color:#a9e9de;align-items:center}
#scene{position:relative;overflow:hidden;isolation:isolate;aspect-ratio:16/8.5;border:1px solid #52717f;border-radius:.5rem;background:#1a2c39}#scene span{position:absolute;overflow:hidden;padding:.12em .3em;display:flex;align-items:center;border-radius:.2em;font-size:clamp(9px,2.2vw,15px);line-height:1.1;white-space:pre-wrap}
#messages{max-height:13rem;overflow:auto}#messages:empty{display:none}#messages article{margin:.3rem 0;padding:.5rem .65rem;border-radius:.45rem;background:#1b363f;overflow-wrap:anywhere;white-space:pre-wrap}#messages article.user{background:#23433f;margin-left:1rem}#messages strong{font-size:.83rem;color:#b4dcd3}#notes{margin:0;padding-left:1.3rem}
</style></head><body><main>
<header><h1>드림워커 제작 GPT</h1><button type="button" id="link" disabled>이 대화 연결</button></header>
<p id="link-status" class="muted">연결하면 스튜디오의 작업 GPT에서 보낸 질문을 이 대화의 모델이 처리해요. 연결은 최대 두 시간이에요.</p>
<label>편집할 화면<select id="screens" disabled></select></label>
<div id="scene" role="img" aria-label="화면 요소 배치 미리보기"></div>
<section id="review" hidden><h2>변경안 검토</h2><ul id="notes"></ul><label id="show-label">미리볼 화면<select id="show"></select></label>
<a id="editor-link" href="https://dreamwalker-snowfield-studio.congenialcockatoo.chatgpt.site/?tool=assistant" target="_blank" rel="noopener noreferrer">스튜디오 초안에서 적용</a></section>
<div id="messages" role="log" aria-live="polite"></div>
<form id="compose"><label>GPT에 요청할 내용<textarea id="prompt" maxlength="3500" placeholder="이 화면에서 백설의 체력이 잘 보이게 해 줘."></textarea></label>
<div class="actions"><button id="send" class="primary" disabled>GPT에 보내기</button><button type="button" id="refresh">답변 확인</button></div></form>
<output id="status" role="status">제작 화면을 읽고 있어요.</output><div class="actions" id="waiting" hidden><button type="button" id="resume">이 대화로 전달</button><button type="button" id="cancel">대기 중인 질문 취소</button></div>
</main><script>/* STUDIO_HOST_BRIDGE */</script><script>/* STUDIO_WORKBENCH */</script></body></html>
