<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>내 파일 · Dreamwalker</title><link rel="stylesheet" href="/style.css"></head>
<body class="device-import"><main><header class="word">DREAMWALKER STUDIO</header><section class="panel">
<h1>내 파일</h1>
<form id="pair-form"><label for="pair-code">편집기에 표시된 연결 코드</label><input id="pair-code" placeholder="00-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="24" required><button type="submit">편집기 연결</button></form>
<label class="native-file" for="disk">파일 선택<input id="disk" type="file" aria-label="파일 선택" multiple></label>
<ul id="picked"></ul><button id="send" class="accent" disabled>편집기로 보내기</button><output id="transfer-status" role="status"></output>
</section></main><script src="/file-wire.js"></script><script src="/device-files.js"></script></body></html>
